# Builds the site and publishes it to GitHub Pages on every push to the main branch.
#
# One-time setup in the GitHub repository:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> add three repository secrets
#      (the values from your EmailJS dashboard, same as in your local .env):
#        VITE_EMAILJS_SERVICE_ID, VITE_EMAILJS_TEMPLATE_ID, VITE_EMAILJS_PUBLIC_KEY
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # With a custom domain (public/CNAME) or a <user>.github.io repository the site is served
      # from "/"; any other repository is served from "/<name>/".
      - name: Work out the base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -f public/CNAME ] || [[ "$REPO" == *.github.io ]]; then echo "BASE_PATH=/" >> "$GITHUB_ENV"; else echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"; fi

      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      # GitHub Pages serves 404.html for unknown paths, so a refresh on an unknown path loads the app
      # instead of GitHub's own 404.
      # Every project page also gets its own index.html (a copy of the app), so /projects/<slug> is a
      # real page with a normal 200 response that search engines can index.
      - name: Single-page-app fallback and project pages
        run: |
          cp dist/index.html dist/404.html
          for slug in $(grep -o 'slug: "[^"]*"' src/data/projects.ts | sed 's/slug: "\(.*\)"/\1/' | sort -u); do
            mkdir -p "dist/projects/$slug"
            cp dist/index.html "dist/projects/$slug/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
