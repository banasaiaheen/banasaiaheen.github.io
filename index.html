<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Bana Saiaheen" />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- A refresh starts again from the top of the page (home) instead of the browser putting the visitor back
         where they were. Only for a refresh without a #section in the address: back/forward still restore the
         position, and src/main.tsx hands restoration back to the browser a moment after loading.
         Turning restoration off is not always honoured in time, so for the first 2 seconds the page also keeps
         itself at the top, until the visitor scrolls, clicks or presses a key. -->
    <script>
      try {
        var navigation = performance.getEntriesByType("navigation")[0];
        if (navigation && navigation.type === "reload" && !location.hash) {
          history.scrollRestoration = "manual";
          var visitorActed = false;
          var started = Date.now();
          ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (name) {
            window.addEventListener(name, function () { visitorActed = true; }, { once: true, passive: true });
          });
          (function keepAtTop() {
            if (visitorActed || Date.now() - started > 2000) return;
            if (window.scrollY) window.scrollTo(0, 0);
            requestAnimationFrame(keepAtTop);
          })();
        }
      } catch (e) {}
    </script>

    <!-- Remembered language (src/i18n/LanguageProvider.tsx): the built pages are English, so for a visitor
         who chose Arabic, set the direction now and hold the page back until the app has switched it
         (it removes "language-pending"; the timer is only a safety net if the script fails to load). -->
    <script>
      try {
        if (localStorage.getItem("language") === "arabic") {
          var root = document.documentElement;
          root.lang = "ar";
          root.dir = "rtl";
          root.classList.add("language-pending");
          setTimeout(function () {
            root.classList.remove("language-pending");
          }, 3000);
        }
      } catch (e) {}
    </script>

    <!-- Each built page gets its own title (below is the dev-server default), description, canonical URL,
         link-preview tags and structured data in place of the marker below: see src/data/seo.ts and
         scripts/prerender.mjs. Fonts are self-hosted (src/styles/fonts.css). -->
    <title>Bana Saiaheen — UX/UI Designer in Amman, Jordan</title>
    <!--seo-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
